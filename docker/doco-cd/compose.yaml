---
volumes:
  data:

configs:
  poll-config.yml:
    content: |
      - url: https://github.com/jazzlyn/dotfiles
        reference: main
        target: ${TARGET}
        interval: 180

services:
  doco-cd:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.105.0@sha256:27e14cc52bc79f8660c321dd4552d780b180fe0d7fe1c9233e4908a5c9f80838
    restart: unless-stopped
    scale: 1 # scale to 0 if you want to stop the service without losing data
    configs:
      - source: poll-config.yml
        target: /poll-config.yml
    environment:
      TZ: Europe/Vienna
      LOG_LEVEL: info
      POLL_CONFIG_FILE: /poll-config.yml
      DEPLOY_CONFIG_BASE_DIR: ./docker
      PROMETHEUS_DATA_DIR: ${PROMETHEUS_DATA_DIR}
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    cap_drop:
      - ALL
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - data:/data
