---
volumes:
  data:

configs:
  poll-config.yml:
    content: |
      - url: https://github.com/jazzlyn/dotfiles
        reference: main
        target: ${TARGET}
        interval: 180

services:
  doco-cd:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.113.0@sha256:3ba0a834787f08ee0b6271c7d84c315bfa68e5026449d018bbabcd8b3c228bd4
    restart: always
    configs:
      - source: poll-config.yml
        target: /poll-config.yml
    environment:
      TZ: Europe/Vienna
      LOG_LEVEL: info
      POLL_CONFIG_FILE: /poll-config.yml
      DEPLOY_CONFIG_BASE_DIR: ./docker
      PROMETHEUS_RETENTION_TIME: ${PROMETHEUS_RETENTION_TIME}
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    cap_drop:
      - ALL
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - data:/data
