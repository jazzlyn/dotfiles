---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  zsh:
    desc: create zsh symlinks
    cmds:
      - chsh -s /usr/bin/zsh
      - ln -rsfT zsh/.zshenv ~/.zshenv
      - ln -rsfT zsh/.zshrc ~/.zshrc

  bash:
    desc: create bash symlinks
    cmds:
      - ln -rsfT bash/bashrc ~/.bashrc

  git:
    desc: create git symlinks
    cmds:
      - mkdir -p ~/.config/git
      - ln -rsfT git/config ~/.config/git/config
      - ln -rsfT git/gitignore ~/.config/git/gitignore

  mise:
    desc: create mise symlinks
    cmds:
      - ln -rsfT mise ~/.config/mise

  podman:
    desc: create podman symlinks
    cmds:
      - ln -rsfT containers ~/.config/containers
      - systemctl --user is-enabled podman.socket > /dev/null 2>&1 && mkdir -p ~/.local/bin && ln -sfT /usr/bin/podman ~/.local/bin/docker || rm -f ~/.local/bin/docker

  opencode:
    desc: create opencode symlinks
    cmds:
      - mkdir -p ~/.config/opencode
      - ln -rsfT opencode/opencode.jsonc ~/.config/opencode/opencode.jsonc
      - ln -rsfT opencode/oh-my-opencode-slim.jsonc ~/.config/opencode/oh-my-opencode-slim.jsonc
      - ln -rsfT opencode/cli.json ~/.config/opencode/cli.json
      - ln -rsfT opencode/oh-my-opencode-slim ~/.config/opencode/oh-my-opencode-slim
      - ln -rsfT ~/notes/AGENTS.md ~/.config/opencode/AGENTS.md

  openchamber:
    desc: create openchamber symlinks (includes opencode)
    cmds:
      - task: opencode
      - systemctl --user link opencode/openchamber.service

  hermes:
    desc: create hermes symlinks
    cmds:
      - mkdir -p ~/.local/bin
      - ln -rsfT hermes/hermes-desktop ~/.local/bin/hermes-desktop
      - systemctl --user link hermes/hermes-dashboard.service

  strg:
    desc: create strg symlinks (requires the secret)
    preconditions:
      - sh: test -f ~/.secrets/github-strg.conf
        msg: "strg: ~/.secrets/github-strg.conf is missing"
    cmds:
      - mkdir -p ~/.config/git
      - ln -rsfT ~/.secrets/github-strg.conf ~/.config/git/github-strg.conf
      - ln -rsfT opencode/oh-my-opencode-slim.strg.jsonc ~/.config/opencode/oh-my-opencode-slim.jsonc

  k9s:
    desc: create k9s symlinks
    cmds:
      - rm -rf ~/.config/k9s
      - ln -rsfT k9s ~/.config/k9s

  wayland:
    desc: create wayland symlinks
    cmds:
      - ln -rsfT wayland/code-flags.conf ~/.config/code-flags.conf
      - ln -rsfT wayland/electron-flags.conf ~/.config/electron-flags.conf

  desktop:
    desc: create desktop app symlinks
    cmds:
      - command -v dunst > /dev/null 2>&1 && ln -rsfT dunst ~/.config/dunst
      - command -v gammastep > /dev/null 2>&1 && ln -rsfT gammastep ~/.config/gammastep
      - command -v kanshi > /dev/null 2>&1 && ln -rsfT kanshi ~/.config/kanshi
      - command -v kitty > /dev/null 2>&1 && ln -rsfT kitty ~/.config/kitty
      - command -v sway > /dev/null 2>&1 && ln -rsfT sway ~/.config/sway
      - command -v swayidle > /dev/null 2>&1 && ln -rsfT swayidle ~/.config/swayidle
      - command -v waybar > /dev/null 2>&1 && ln -rsfT waybar ~/.config/waybar
      - command -v wireplumber > /dev/null 2>&1 && ln -rsfT wireplumber ~/.config/wireplumber
      - pacman -Qq xdg-desktop-portal-wlr > /dev/null 2>&1 && ln -rsfT xdg-desktop-portal-wlr ~/.config/xdg-desktop-portal-wlr

  tools:
    desc: create terminal tool symlinks
    cmds:
      - command -v nvim > /dev/null 2>&1 && mkdir -p ~/.config/nvim && ln -rsfT nvim/init.vim ~/.config/nvim/init.vim && ln -rsfT nvim/init.vim ~/.vimrc
      - command -v pacman > /dev/null 2>&1 && mkdir -p ~/.config/pacman && ln -rsfT makepkg.conf ~/.config/pacman/makepkg.conf
      - command -v ranger > /dev/null 2>&1 && mkdir -p ~/.config/ranger && ln -rsfT ranger/commands.py ~/.config/ranger/commands.py && ln -rsfT ranger/rc.conf ~/.config/ranger/rc.conf && ln -rsfT ranger/scope.sh ~/.config/ranger/scope.sh
      - command -v starship > /dev/null 2>&1 && ln -rsfT starship/starship.toml ~/.config/starship.toml
      - command -v yay > /dev/null 2>&1 && mkdir -p ~/.config/yay && ln -rsfT yay/config.json ~/.config/yay/config.json
