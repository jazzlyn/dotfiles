---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  base:
    desc: install base packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        age
        atool
        base
        base-devel
        bash-completion
        git
        less
        mise
        neovim
        openssh
        ranger
        sops
        starship
        tig
        tree
        vim
        zsh
        zsh-completions
        zsh-syntax-highlighting

  system:
    desc: install system packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        cups
        ghostscript
        intel-ucode
        libfido2
        linux
        linux-firmware
        networkmanager
        ssh-tpm-agent
        syncthing
        tpm2-tools
        tpm2-tss

  nvidia:
    desc: install nvidia packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        nvidia-container-toolkit
        nvidia-open

  devtools:
    desc: install development tools
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        bun
        github-cli
        docker
        docker-buildx
        docker-compose
        podman
        podman-compose
        google-cloud-cli

  sysutils:
    desc: install system utility packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        bind
        bluez-utils
        btrfs-progs
        btop
        net-tools
        nvme-cli
        smartmontools
        strace
        traceroute

  wayland:
    desc: install wayland packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        dunst
        gammastep
        gnome-keyring
        grim
        kanshi
        kitty
        network-manager-applet
        noto-fonts
        noto-fonts-emoji
        pavucontrol-qt
        pipewire
        pipewire-libcamera
        pipewire-pulse
        python-pillow
        qt6-wayland
        slurp
        ttf-inconsolata-go-nerd
        waybar
        wmenu
        xdg-desktop-portal
        xdg-desktop-portal-gtk
        xdg-desktop-portal-wlr
        xorg-xwayland

  sway:
    desc: install sway packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        sway
        swaybg
        swayidle
        swaylock

  plasma:
    desc: install plasma desktop packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        konsole
        kscreen
        plasma-desktop
        plasma-nm
        plasma-pa

  productivity:
    desc: install productivity packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        flameshot
        google-chrome
        obsidian
        vesktop-bin

  gaming:
    desc: install gaming packages
    internal: true
    cmds:
      - yay -Sy --needed --noconfirm
        glfw
        prismlauncher

  workstation:
    desc: install workstation packages
    internal: true
    cmds:
      - sudo apt update && sudo apt install --no-install-recommends -y
        atool
        dnsutils
        neovim
        net-tools
        ranger
        starship
        strace
        traceroute

  strg:
    desc: install strg packages
    internal: true
    cmds:
      - yay -Syu --needed --noconfirm
        azure-cli
        google-cloud-cli-gke-gcloud-auth-plugin
        networkmanager-vpn-plugin-openvpn
        openvpn
