[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "npm", "pnpm", "pre-commit", "ruff", "python"]
python.uv_venv_auto = true

[env]
_.file = [
    { path = "$HOME/.secrets/bao-config", redact = true },
    { path = "$HOME/.secrets/vertex-config", redact = true },
    { path = "$HOME/.secrets/github-token-jazzlyn", redact = true },
    { path = "$HOME/.secrets/otel-bearer-token", redact = true },
]
OPENCODE_CONFIG = "$HOME/.secrets/opencode.json"
SOPS_AGE_KEY_FILE = "$HOME/.secrets/age-keys"

[tools]
"aqua:anomalyco/opencode" = "1.18.34"
"aqua:anthropics/claude-code" = "2.1.288"
"aqua:astral-sh/uv" = "0.12.23"
"aqua:derailed/k9s" = "0.51.0"
"aqua:docker/compose" = "5.6.0"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:google/go-containerregistry" = "0.22.1"
"aqua:int128/kubelogin" = "1.36.4"
"aqua:jqlang/jq" = "1.7.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:kubernetes/kubectl" = "1.33.4"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:nodejs/node" = "26.10.0"
"aqua:openbao/openbao/bao" = "2.7.1"
"aqua:oven-sh/bun" = "1.4.0"
"aqua:pnpm/pnpm" = "12.9.1"
"aqua:pre-commit/pre-commit" = "4.6.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:rtk-ai/rtk" = "0.51.0"
"aqua:tmux/tmux-builds" = "3.6b"
"github:home-operations/flate" = "0.6.5"
"pipx:pyflakes" = "4.0.1"
