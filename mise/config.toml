[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
python.uv_venv_auto = true

[env]
_.file = [
    { path = "$HOME/.secrets/bao-config", redact = true },
    { path = "$HOME/.secrets/vertex-config", redact = true },
    { path = "$HOME/.secrets/github-token-jazzlyn", redact = true },
]
OPENCODE_CONFIG = "$HOME/.secrets/opencode.json"
SOPS_AGE_KEY_FILE = "$HOME/.secrets/age-keys"

[tools]
"aqua:anomalyco/opencode" = "1.18.29"
"aqua:anthropics/claude-code" = "2.1.261"
"aqua:astral-sh/uv" = "0.12.10"
"aqua:derailed/k9s" = "0.51.0"
"aqua:docker/compose" = "5.5.1"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.53.1"
"aqua:google/go-containerregistry" = "0.22.1"
"aqua:int128/kubelogin" = "1.36.3"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes/kubectl" = "1.33.4"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:nodejs/node" = "26.8.1"
"aqua:openbao/openbao/bao" = "2.6.2"
"aqua:oven-sh/bun" = "1.4.0"
"aqua:pnpm/pnpm" = "12.3.4"
"aqua:pre-commit/pre-commit" = "4.6.2"
"aqua:rtk-ai/rtk" = "0.48.0"
"aqua:tmux/tmux-builds" = "3.6b"
"core:go" = "1.27.1"
"go:github.com/home-operations/flate/cmd/flate" = "v0.6.5"
