---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  PROJECT_DIR:
    sh: "git rev-parse --show-toplevel"

includes:
  install: .taskfiles/install.yaml
  maintenance: .taskfiles/maintenance.yaml
  pre-commit: .taskfiles/pre-commit.yaml
  symlinks: .taskfiles/symlinks.yaml

tasks:
  lint:
    desc: lint codebase
    dir: "{{.PROJECT_DIR}}"
    cmds:
      - task: pre-commit:init
      - task: pre-commit:run

  k9s-logs:
    desc: show k9s logs
    cmds:
      - tail -f $HOME/.local/state/k9s/k9s.log

  setup-carbon:
    desc: setup carbon
    cmds:
      - task: install:base
      - task: install:system
      - task: install:intel
      - task: install:sysutils
      - task: install:wayland
      - task: install:sway
      - task: install:productivity
      - task: install:devtools
      - task: symlinks:zsh
      - task: symlinks:git
      - task: symlinks:mise
      - task: symlinks:k9s
      - task: symlinks:wayland
      - task: symlinks:desktop
      - task: symlinks:tools

  setup-coal:
    desc: setup coal
    cmds:
      - task: install:base
      - task: install:system
      - task: install:intel
      - task: install:coal
      - task: install:sysutils
      - task: install:wayland
      - task: install:sway
      - task: install:productivity
      - task: install:strg
      - task: install:devtools
      - task: symlinks:zsh
      - task: symlinks:git
      - task: symlinks:mise
      - task: symlinks:k9s
      - task: symlinks:wayland
      - task: symlinks:desktop
      - task: symlinks:tools
      - task: symlinks:strg

  setup-purple:
    desc: setup purple
    cmds:
      - task: install:base
      - task: install:system
      - task: install:intel
      - task: install:nvidia
      - task: install:sysutils
      - task: install:wayland
      - task: install:sway
      - task: install:productivity
      - task: install:devtools
      - task: install:gaming
      - task: symlinks:zsh
      - task: symlinks:git
      - task: symlinks:mise
      - task: symlinks:k9s
      - task: symlinks:wayland
      - task: symlinks:desktop
      - task: symlinks:tools

  setup-hades:
    desc: setup hades
    cmds:
      - task: install:base
      - task: install:system
      - task: install:intel
      - task: install:amd
      - task: install:sysutils
      - task: install:plasma
      - task: install:productivity
      - task: install:devtools
      - task: install:gaming
      - task: symlinks:zsh
      - task: symlinks:git
      - task: symlinks:mise
      - task: symlinks:k9s
      - task: symlinks:wayland
      - task: symlinks:desktop
      - task: symlinks:tools

  setup-agentix:
    desc: setup agentix
    cmds:
      - task: install:base
      - task: install:system
      - task: install:devtools
      - task: install:sysutils
      - task: symlinks:bash
      - task: symlinks:git
      - task: symlinks:mise
      - task: symlinks:openchamber
      - task: symlinks:hermes
      - bun add -g @openchamber/web
      - bun add -g --trust @opencode/cli

  setup-assistant:
    desc: setup assistant (run as separate non-root user)
    cmds:
      - task: symlinks:bash
      - task: symlinks:git
      - task: symlinks:mise
      - task: symlinks:podman
      - task: symlinks:openchamber
      - task: symlinks:strg
      # - bun add -g @openchamber/web
      # - bun add -g --trust @opencode/cli

  setup-workstation:
    desc: setup workstation
    cmds:
      - task: install:workstation
      - task: symlinks:zsh
      - task: symlinks:git
      - task: symlinks:mise
      - task: symlinks:k9s
      - task: symlinks:tools
      - task: symlinks:strg
      - mkdir -p ~/scripts && ln -rsf init.sh ~/scripts
