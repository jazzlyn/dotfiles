---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  PROJECT_DIR:
    sh: "git rev-parse --show-toplevel"

includes:
  install: .taskfiles/install.yaml
  maintenance: .taskfiles/maintenance.yaml
  pre-commit: .taskfiles/pre-commit.yaml
  symlinks: .taskfiles/symlinks.yaml

tasks:
  lint:
    desc: lint codebase
    dir: "{{.PROJECT_DIR}}"
    cmds:
      - task: pre-commit:init
      - task: pre-commit:run

  k9s-logs:
    desc: show k9s logs
    cmds:
      - tail -f $HOME/.local/state/k9s/k9s.log

  setup-carbon:
    desc: setup carbon
    cmds:
      - task: install:base
      - task: install:system
      - task: install:sysutils
      - task: install:wayland
      - task: install:sway
      - task: install:productivity
      - task: install:devtools
      - task: symlinks:base
      - task: symlinks:apps

  setup-coal:
    desc: setup coal
    cmds:
      - task: install:base
      - task: install:system
      - task: install:sysutils
      - task: install:wayland
      - task: install:sway
      - task: install:productivity
      - task: install:strg
      - task: install:devtools
      - task: symlinks:base
      - task: symlinks:apps
      - task: symlinks:strg

  setup-purple:
    desc: setup purple
    cmds:
      - task: install:base
      - task: install:system
      - task: install:nvidia
      - task: install:sysutils
      - task: install:wayland
      - task: install:sway
      - task: install:productivity
      - task: install:devtools
      - task: install:gaming
      - task: symlinks:base
      - task: symlinks:apps

  setup-hades:
    desc: setup hades
    cmds:
      - task: install:base
      - task: install:system
      - task: install:sysutils
      - task: install:plasma
      - task: install:productivity
      - task: install:devtools
      - task: install:gaming
      - task: symlinks:base
      - task: symlinks:apps

  setup-agentix:
    desc: setup agentix
    cmds:
      - task: install:base
      - task: install:system
      - task: install:devtools
      - task: install:sysutils
      - task: symlinks:agentix
      - bun add -g @openchamber/web
      - bun add -g --trust @opencode/cli
      # - rtk init -g --opencode --auto-patch doesnt work with 2.0

  setup-workstation:
    desc: setup workstation
    cmds:
      - task: install:workstation
      - task: symlinks:base
      - task: symlinks:apps
      - mkdir -p ~/scripts && ln -rsf init.sh ~/scripts

  setup-wsl:
    desc: setup wsl
    cmds:
      - task: install:base
      - task: install:sysutils
      # - task: install:devtools
      - task: symlinks:base
      - task: symlinks:apps
